[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-ai"
version = "1.0.0"
description = "AI Customer Support & Sales Assistant for Emporio da Musica (Artefact Technical Challenge)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
